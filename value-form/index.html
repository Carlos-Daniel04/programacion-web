<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mail.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
  </head>
  <body>

    <main class="main">
      <section class="conteiner">
        <form class="conteiner-form">
          <h1 class="form-title">Registro</h1>
          <div class="label">
            <input type="text" name="nform" placeholder="Nombre"
              class="form-input " />
            <input type="text" name="lform" placeholder="Apellido"
              class="form-input" />
          </div>

          <div class="form-group">
            <label><input type="radio" name="genero" value="masculino">
              Masculino</label>
            <label><input type="radio" name="genero" value="femenino">
              Femenino</label>
            <label><input type="radio" name="genero" value="otro"> Otro</label>
          </div>

          <h2 class="form-title">Areas con disponibilidad</h2>
          <div class="form-check">
            <label><input type="checkbox" name="areas" value="tegnologia">Tecnologia</label>
            <label><input type="checkbox" name="areas" value="soporte">Soporte</label>
            <label><input type="checkbox" name="areas" value="redes">Redes</label>
            <label><input type="checkbox" name="areas" value="data">Data</label>
          </div>

          <h2 class="form-title">Horario de disponibilidad</h2>
          <select type="select" name="horario">
            <option value="mañana">Mañana</option>
            <option value="tarde">Tarde</option>
            <option value="noche">Noche</option>
          </select>

          <h2 class="form-title">Comentarios</h2>
          <textarea name="comentarios"
            placeholder="Escribe tus comentarios aquí..."></textarea>

          <button type="submit" class="form-button">Enviar</button>

        </form>
      </section>

    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
